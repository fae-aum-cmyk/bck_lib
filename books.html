    const grid = document.getElementById('resourceGrid');
    const search = document.getElementById('searchInput');
    const title = document.getElementById('viewTitle');
    const count = document.getElementById('countLabel');
    let selectedClass = 'ALL';

    function escapeHTML(value) {
      return String(value).replace(/[&<>'"]/g, char => ({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[char]));
    }

    function draw() {
      const term = search.value.trim().toLowerCase();
      const filtered = BOOKS.filter(book => {
        const matchesClass = selectedClass === 'ALL' || book.cls === selectedClass || book.cls === 'ALL';
        const searchable = `${book.title} ${book.subject} ${book.author} ${book.format}`.toLowerCase();
        return matchesClass && searchable.includes(term);
      });
      title.textContent = selectedClass === 'ALL' ? 'All resources' : `${selectedClass} library`;
      count.textContent = `${filtered.length} resource${filtered.length === 1 ? '' : 's'} found`;
      grid.innerHTML = filtered.length ? filtered.map(book => {
        const ready = book.url && !book.url.includes('DRIVE_LINK_GOES_HERE');
        return `<article class="resource-card glass">
          <div class="resource-cover">📖</div>
          <div class="resource-meta"><span class="chip">${escapeHTML(book.cls === 'ALL' ? 'ALL CLASSES' : book.cls)}</span><span class="format">${escapeHTML(book.format)}</span></div>
          <h3>${escapeHTML(book.title)}</h3>
          <p class="subject">${escapeHTML(book.subject)}</p>
          <p class="author">${escapeHTML(book.author)}</p>
          ${ready ? `<a class="btn-gold full-btn" href="${escapeHTML(book.url)}" target="_blank" rel="noopener">Open resource</a>` : `<span class="btn-disabled">Link not added yet</span>`}
        </article>`;
      }).join('') : '<div class="empty-state glass"><h3>No resources found</h3><p>Try another class or search term.</p></div>';
    }

    document.querySelectorAll('.filter-btn').forEach(button => button.addEventListener('click', () => {
      selectedClass = button.dataset.class;
      document.querySelectorAll('.filter-btn').forEach(item => item.classList.remove('active'));
      button.classList.add('active');
      draw();
    }));
    search.addEventListener('input', draw);
    const hashClass = location.hash.replace('#','').toUpperCase();
    if (/^S[1-6]$/.test(hashClass)) {
      selectedClass = hashClass;
      const button = document.querySelector(`[data-class="${hashClass}"]`);
      document.querySelectorAll('.filter-btn').forEach(item => item.classList.remove('active'));
      button.classList.add('active');
    }
    draw();
  </script>
